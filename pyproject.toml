[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "opteryx-flight"
version = "0.0.2"
description = "Opteryx Arrow Flight SQL Service"
requires-python = '>=3.14'
dependencies = [
    "cryptography==50.0.1",
    "google-cloud-firestore==2.33.0",
    "google-cloud-secret-manager==2.30.0",
    "google-cloud-storage==3.15.1",
    "opteryx-catalog[kms]>=0.4.141",
    "opteryx-shared-services[web,storage,secrets]>=0.2.2",
    "opteryx-core>=0.9.146",
    "opteryx-access>=0.2.15",
    "opteryx-iceberg>=0.1.9",
    "protobuf>=7.36.2,<8",
    "pyarrow==25.0.1",
    "python-jose[cryptography]==3.5.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
# What CI installs to run tests/. Kept as an extra, matching opteryx-access,
# so the test job's install is one command and cannot drift from what a
# developer gets locally.
dev = [
    "pytest>=8",
]

[tool.isort]
profile = "black"
extend_skip_glob = ["tests/**"]
skip_gitignore = true
line_length = 100
multi_line_output = 9
force_single_line = true
float_to_top = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py313'
exclude = ["tests/"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100
